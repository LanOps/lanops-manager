kind: pipeline
type: docker
name: ci

# No pull_request event: every PR branch push already gets a push build, so PRs would run twice
trigger:
  event:
    - push
    - tag

services:
  - name: database
    image: mariadb:11
    environment:
      MARIADB_DATABASE: lanops_test
      MARIADB_USER: lanops
      MARIADB_PASSWORD: secret
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"

steps:

# ── Lint & Test ────────────────────────────────────────────────────────────────

  - name: discord-lint-start
    image: curlimages/curl:8.7.1
    failure: ignore
    environment:
      DISCORD_WEBHOOK_URL:
        from_secret: discord_webhook_url
    commands:
      - |
        curl -s -X POST "$DISCORD_WEBHOOK_URL" -H "Content-Type: application/json" -d "{\"embeds\":[{\"title\":\"$DRONE_REPO - $DRONE_SOURCE_BRANCH - Lint & Test Started!\",\"url\":\"$DRONE_BUILD_LINK\"}]}"

  - name: lint
    image: php:8.4-cli
    commands:
      - apt-get update -q && apt-get install -yq git unzip libfreetype-dev libjpeg62-turbo-dev libpng-dev
      - docker-php-ext-configure gd --with-freetype --with-jpeg
      - docker-php-ext-install bcmath exif gd
      - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
      - cd /drone/src/src && composer install --no-interaction --prefer-dist --no-progress
      - vendor/bin/phpcs

  - name: test
    image: php:8.4-cli
    environment:
      DB_HOST: database
    commands:
      - apt-get update -q && apt-get install -yq libfreetype-dev libjpeg62-turbo-dev libpng-dev libmagickwand-dev
      - docker-php-ext-configure gd --with-freetype --with-jpeg
      - docker-php-ext-install bcmath exif gd pdo_mysql
      # imagick renders the PNG ticket QR codes (same version as the app image)
      - pecl install imagick-3.8.0 && docker-php-ext-enable imagick
      - cd /drone/src/src
      # composer install in the lint step runs "artisan optimize", which caches production config and would make phpunit ignore phpunit.xml
      - php artisan optimize:clear
      - php -r 'for ($i = 0; $i < 30; $i++) { try { new PDO("mysql:host=database;dbname=lanops_test", "lanops", "secret"); exit(0); } catch (PDOException $e) { sleep(2); } } exit(1);'
      - vendor/bin/phpunit

  - name: discord-lint-success
    image: curlimages/curl:8.7.1
    failure: ignore
    environment:
      DISCORD_WEBHOOK_URL:
        from_secret: discord_webhook_url
    commands:
      - |
        curl -s -X POST "$DISCORD_WEBHOOK_URL" -H "Content-Type: application/json" -d "{\"embeds\":[{\"title\":\"$DRONE_REPO - $DRONE_SOURCE_BRANCH - Lint & Test Success!\",\"url\":\"$DRONE_BUILD_LINK\"}]}"
    when:
      status:
        - success

  - name: discord-lint-failure
    image: curlimages/curl:8.7.1
    failure: ignore
    environment:
      DISCORD_WEBHOOK_URL:
        from_secret: discord_webhook_url
    commands:
      - |
        curl -s -X POST "$DISCORD_WEBHOOK_URL" -H "Content-Type: application/json" -d "{\"embeds\":[{\"title\":\"$DRONE_REPO - $DRONE_SOURCE_BRANCH - Lint & Test Failure!\",\"url\":\"$DRONE_BUILD_LINK\"}]}"
    when:
      status:
        - failure

# ── Docker Build & Push ───────────────────────────────────────────────────────
# Images are only built and pushed for pushes to main and for tags.
# ref (not branch) is used because Drone sets DRONE_BRANCH to the target branch on pull_request builds.

  - name: discord-build-start
    image: curlimages/curl:8.7.1
    failure: ignore
    environment:
      DISCORD_WEBHOOK_URL:
        from_secret: discord_webhook_url
    commands:
      - |
        curl -s -X POST "$DISCORD_WEBHOOK_URL" -H "Content-Type: application/json" -d "{\"embeds\":[{\"title\":\"$DRONE_REPO - $DRONE_SOURCE_BRANCH - Build Started!\",\"url\":\"$DRONE_BUILD_LINK\"}]}"
    when:
      ref:
        - refs/heads/main
        - refs/tags/*
      event:
        - push
        - tag

  - name: build-push-nginx
    image: plugins/docker
    settings:
      repo: lanopsdev/lanops-manager
      dockerfile: resources/docker/nginx/Dockerfile
      username:
        from_secret: dockerhub_username
      password:
        from_secret: dockerhub_token
      tags:
        - nginx-main
    when:
      ref:
        - refs/heads/main
      event:
        - push

  - name: build-push-app
    image: plugins/docker
    settings:
      repo: lanopsdev/lanops-manager
      dockerfile: resources/docker/php/Dockerfile
      username:
        from_secret: dockerhub_username
      password:
        from_secret: dockerhub_token
      tags:
        - app-main
    when:
      ref:
        - refs/heads/main
      event:
        - push

  - name: build-push-nginx-release
    image: plugins/docker
    settings:
      repo: lanopsdev/lanops-manager
      dockerfile: resources/docker/nginx/Dockerfile
      username:
        from_secret: dockerhub_username
      password:
        from_secret: dockerhub_token
      tags:
        - nginx-${DRONE_TAG}
    when:
      event:
        - tag

  - name: build-push-app-release
    image: plugins/docker
    settings:
      repo: lanopsdev/lanops-manager
      dockerfile: resources/docker/php/Dockerfile
      username:
        from_secret: dockerhub_username
      password:
        from_secret: dockerhub_token
      tags:
        - app-${DRONE_TAG}
    when:
      event:
        - tag

  - name: discord-build-success
    image: curlimages/curl:8.7.1
    failure: ignore
    environment:
      DISCORD_WEBHOOK_URL:
        from_secret: discord_webhook_url
    commands:
      - |
        curl -s -X POST "$DISCORD_WEBHOOK_URL" -H "Content-Type: application/json" -d "{\"embeds\":[{\"title\":\"$DRONE_REPO - $DRONE_SOURCE_BRANCH - Build Success!\",\"url\":\"$DRONE_BUILD_LINK\"}]}"
    when:
      ref:
        - refs/heads/main
        - refs/tags/*
      event:
        - push
        - tag
      status:
        - success

  - name: discord-build-failure
    image: curlimages/curl:8.7.1
    failure: ignore
    environment:
      DISCORD_WEBHOOK_URL:
        from_secret: discord_webhook_url
    commands:
      - |
        curl -s -X POST "$DISCORD_WEBHOOK_URL" -H "Content-Type: application/json" -d "{\"embeds\":[{\"title\":\"$DRONE_REPO - $DRONE_SOURCE_BRANCH - Build Failure!\",\"url\":\"$DRONE_BUILD_LINK\"}]}"
    when:
      ref:
        - refs/heads/main
        - refs/tags/*
      event:
        - push
        - tag
      status:
        - failure
