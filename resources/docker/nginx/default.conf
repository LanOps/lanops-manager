server {
    index index.php index.html;
    server_name phpfpm.local;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
    root /var/www/html/public;

    # Don't advertise versions
    server_tokens off;
    fastcgi_hide_header X-Powered-By;

    # Security headers, on every response including errors
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;

    gzip              on;
    # Text formats only: JPEG, PNG and video are already compressed (text/html is always on)
    gzip_types        text/css text/plain text/xml application/javascript application/json application/xml image/svg+xml image/x-icon font/ttf application/vnd.ms-fontobject;

    # Keep in step with post_max_size in resources/docker/php/uploads.ini
    client_max_body_size 512M;

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
    location / {
        try_files $uri $uri/ /index.php?$query_string;
        gzip_static on;
    }

    # Browser caching. Only "expires" here: an add_header in a location would drop the security headers above.
    # Vite's build files have a content hash in their names, so a changed file always gets a new URL;
    # ^~ stops the file-type rule below from taking these over.
    location ^~ /build/ {
        expires 1y;
        try_files $uri =404;
    }
    # Images, fonts, videos and the old scripts in public/ change rarely; a week keeps repeat visits fast
    location ~* \.(?:css|js|png|jpe?g|gif|webp|svg|ico|woff2?|ttf|eot|mp4|webm)$ {
        expires 7d;
        try_files $uri /index.php?$query_string;
    }
}

