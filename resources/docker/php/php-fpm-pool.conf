; PHP-FPM worker pool for www.lanops.co.uk, loaded after the image's www.conf and zz-docker.conf.
; The image default is 5 workers, so a few slow requests at once left nobody to serve the rest of the site.
; Sized for the 3 GB production server, which also runs MariaDB, nginx, Traefik, the queue workers and cron:
; a normal request uses about 40-60 MB, so 15 workers stay well under 1 GB.
[www]
pm = dynamic
pm.max_children = 15
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
; Recycle each worker now and then, so one that grew on a big gallery upload gives its memory back
pm.max_requests = 500
